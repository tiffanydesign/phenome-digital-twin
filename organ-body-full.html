<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Point Body — Full Viscera</title>

<style>
  :root {
    --sans: "Inter Tight", "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont,
            "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;

    --ink: #0a1c2e; --ink-2: #3d5570; --ink-3: #8296ad;
    --hair: rgba(10,28,46,.10); --hair-2: rgba(10,28,46,.06);
    --bg-a: #d6e7f8; --bg-b: #fbfdff;

    --panel: rgba(255,255,255,.62); --panel-brd: rgba(255,255,255,.78);
    --accent: #0fa3c0; --accent-dk: #06798f; --accent-sf: rgba(15,163,192,.12);

    --shadow: 0 1px 2px rgba(10,28,46,.06), 0 8px 24px -8px rgba(10,28,46,.16),
              0 32px 64px -24px rgba(10,28,46,.22);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: var(--sans); color: var(--ink); background: var(--bg-b); -webkit-font-smoothing: antialiased; }

  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- boot ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 90; display: grid; place-items: center;
    background: linear-gradient(178deg, var(--bg-a), var(--bg-b));
    transition: opacity .55s ease; text-align: center;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  .bt { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .bs { font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; }
  .bar { width: 230px; height: 2px; border-radius: 2px; background: var(--hair); margin: 18px auto 0; overflow: hidden; }
  /* scaleX rather than width: the bar advances once per organ load, and a
     transform keeps it off the layout path */
  .bar i { display: block; width: 100%; height: 100%; background: var(--accent);
           transform: scaleX(0); transform-origin: left center;
           transition: transform .35s cubic-bezier(.3,.9,.3,1); }
  .err { max-width: 380px; margin: 16px auto 0; font-size: 12px; line-height: 1.55; color: #b4353f; white-space: pre-wrap; text-align: left; }

  /* ---------- panel ---------- */
  #panel {
    position: fixed; left: 16px; top: 16px; bottom: 16px; width: 336px;
    display: flex; flex-direction: column; border-radius: 18px;
    background: var(--panel); border: 1px solid var(--panel-brd); box-shadow: var(--shadow);
    backdrop-filter: blur(26px) saturate(165%); -webkit-backdrop-filter: blur(26px) saturate(165%);
    overflow: hidden; z-index: 30;
    transition: transform .42s cubic-bezier(.2,.85,.2,1), opacity .3s ease;
  }
  #panel.hidden { transform: translateX(calc(-100% - 24px)); opacity: 0; pointer-events: none; }

  .p-head { padding: 15px 18px 13px; border-bottom: 1px solid var(--hair); flex: none; }
  .p-eyebrow { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent-dk); display: flex; align-items: center; gap: 7px; }
  .p-eyebrow::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px 1px rgba(15,163,192,.7); }
  .p-title { font-size: 17px; font-weight: 700; letter-spacing: -.015em; margin: 7px 0 1px; }
  .p-cn { font-size: 11px; font-weight: 500; color: var(--ink-2); }

  #pbody { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 2px 0 22px; }
  #pbody::-webkit-scrollbar { width: 8px; }
  #pbody::-webkit-scrollbar-thumb { background: rgba(10,28,46,.14); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }

  .sec { border-bottom: 1px solid var(--hair-2); }
  .sec-h {
    display: flex; align-items: center; gap: 8px; padding: 12px 18px 10px; cursor: pointer;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .17em; text-transform: uppercase; color: var(--ink-2);
    user-select: none;
  }
  .sec-h:hover { color: var(--accent-dk); }
  .sec-h .caret { margin-left: auto; width: 7px; height: 7px; border-right: 1.4px solid currentColor; border-bottom: 1.4px solid currentColor; transform: rotate(45deg) translate(-2px,-2px); transition: transform .26s cubic-bezier(.2,.85,.2,1); opacity: .55; }
  .sec.closed .caret { transform: rotate(-45deg) translate(-1px,1px); }
  .sec-b { padding: 0 18px 14px; display: grid; gap: 10px; }
  .sec.closed .sec-b { display: none; }

  .row { display: grid; gap: 5px; }
  .lab { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; font-weight: 500; color: var(--ink-2); }
  .lab .v { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink); background: rgba(10,28,46,.05); padding: 2px 6px; border-radius: 5px; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 15px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: rgba(10,28,46,.13); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; margin-top: -5px;
    background: #fff; border: 1.5px solid var(--accent); box-shadow: 0 1px 4px rgba(10,28,46,.25);
  }
  input[type=color] { -webkit-appearance: none; appearance: none; width: 100%; height: 25px; padding: 0; border: 1px solid var(--hair); border-radius: 7px; background: none; cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 5px; }

  .tog { display: flex; align-items: center; gap: 9px; font-size: 11.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; user-select: none; }
  .tog .sw { flex: none; width: 32px; height: 18px; border-radius: 999px; background: rgba(10,28,46,.16); position: relative; transition: background .22s ease; }
  .tog .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(10,28,46,.3); transition: transform .22s cubic-bezier(.3,.8,.3,1); }
  .tog.on .sw { background: var(--accent); }
  .tog.on .sw::after { transform: translateX(14px); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--hair); background: rgba(255,255,255,.5);
    font-size: 11px; font-weight: 500; color: var(--ink-2); cursor: pointer; transition: all .18s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent-dk); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 8px -2px rgba(15,163,192,.6); }

  /* ---------- organ list ---------- */
  .olist { display: grid; gap: 3px; }
  .orow {
    display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 9px;
    cursor: pointer; transition: background .16s ease; border: 1px solid transparent;
  }
  .orow:hover { background: rgba(255,255,255,.55); }
  .orow.sel { background: rgba(255,255,255,.85); border-color: var(--accent); }
  .orow .sw2 {
    flex: none; width: 26px; height: 15px; border-radius: 999px; background: rgba(10,28,46,.16);
    position: relative; transition: background .2s ease;
  }
  .orow .sw2::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(10,28,46,.3); transition: transform .22s cubic-bezier(.3,.8,.3,1); }
  .orow.vis .sw2 { background: var(--accent); }
  .orow.vis .sw2::after { transform: translateX(11px); }
  .orow .swatch { flex: none; width: 9px; height: 9px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(10,28,46,.16); }
  .orow .nm { font-size: 11.5px; font-weight: 500; color: var(--ink); }
  .orow .cn { font-size: 10px; color: var(--ink-3); margin-left: auto; }
  .orow.off .nm, .orow.off .cn { opacity: .42; }

  .note { font-size: 10.5px; line-height: 1.5; color: var(--ink-3); }
  .btn {
    padding: 7px 12px; border-radius: 8px; border: 1px solid var(--hair); background: rgba(255,255,255,.6);
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-2); cursor: pointer; text-align: center; transition: all .18s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-dk); }

  /* ---------- hud ---------- */
  #hud {
    position: fixed; right: 16px; top: 16px; z-index: 20; padding: 12px 14px; border-radius: 13px;
    background: var(--panel); border: 1px solid var(--panel-brd); box-shadow: var(--shadow);
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    font-family: var(--mono); font-size: 10px; color: var(--ink-2);
    display: grid; grid-template-columns: auto auto; gap: 4px 16px; min-width: 176px;
  }
  #hud b { color: var(--ink); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  #hud .k { text-transform: uppercase; letter-spacing: .14em; font-size: 8.5px; color: var(--ink-3); align-self: center; }

  .fab {
    position: fixed; z-index: 40; padding: 9px 14px; border-radius: 11px; border: 1px solid var(--panel-brd);
    background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(20px) saturate(160%);
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-2); cursor: pointer; user-select: none; transition: all .2s ease;
  }
  .fab:hover { color: var(--accent-dk); border-color: var(--accent); }
  #fab-panel { left: 16px; top: 16px; opacity: 0; pointer-events: none; }
  #panel.hidden ~ #fab-panel { opacity: 1; pointer-events: auto; }
  #fab-reset { right: 16px; bottom: 16px; }
  #fab-shot { right: 128px; bottom: 16px; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 14px); z-index: 60;
    padding: 9px 16px; border-radius: 10px; background: rgba(10,28,46,.9); color: #fff;
    font-size: 12px; font-weight: 500; opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s cubic-bezier(.2,.85,.2,1);
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 760px) {
    #panel { left: 8px; right: 8px; width: auto; top: auto; height: 50vh; bottom: 8px; }
    #hud { right: 8px; top: 8px; }
  }
</style>

<canvas id="gl"></canvas>

<div id="hud">
  <span class="k">Points</span><b id="hud-pts">—</b>
  <span class="k">Organs</span><b id="hud-org">—</b>
  <span class="k">Organ tris</span><b id="hud-otris">—</b>
  <span class="k">FPS</span><b id="hud-fps">—</b>
</div>

<div id="panel">
  <div class="p-head">
    <div class="p-eyebrow">Stage 1b · Full viscera</div>
    <div class="p-title">Point Body</div>
    <div class="p-cn">Contour Fade point shell, seven organs in full</div>
  </div>
  <div id="pbody"></div>
</div>

<div class="fab" id="fab-panel">Panel</div>
<div class="fab" id="fab-shot">PNG</div>
<div class="fab" id="fab-reset">Reset view</div>
<div id="toast"></div>

<div id="boot">
  <div>
    <div class="bt">Loading</div>
    <div class="bs" id="boot-sub">render engine</div>
    <div class="bar"><i id="boot-bar"></i></div>
    <div class="err" id="boot-err" hidden></div>
  </div>
</div>

<script type="module">
/* ==========================================================================
   Point Body — full viscera.

   Two things over the stage-1 spike:

   1. The shell shader is a port of the lab's Contour Fade preset. That preset
      is a screen-space halftone (ptLightMix 0, ptInvert, contrast 1.8, floor
      0.045) which cannot have anything behind it. Ported per-point it keeps
      the same ink model — heaviest at grazing angles, fading inward — while
      being real depth-tested geometry. The fade is not just cosmetic here: it
      thins the dots exactly over the middle of the torso, which is where the
      organs need to show through.

   2. Seven organs, placed by anatomical fraction of body height rather than by
      any number carried in the source files.
   ========================================================================== */

const $ = (s) => document.querySelector(s);
const boot = $('#boot');
const bootSub = $('#boot-sub'), bootBar = $('#boot-bar');

/* ---------------------------------------------------------------- 1. loader */
const sources = [
  './vendor/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
];
let THREE = null;
for (const src of sources) {
  try { const mod = await import(src); if (mod && mod.WebGLRenderer) { THREE = mod; break; } } catch (e) {}
}
if (!THREE) {
  boot.querySelector('.bt').textContent = 'Could not load three.js';
  boot.querySelector('.bar').remove();
  const err = $('#boot-err'); err.hidden = false;
  err.textContent = 'vendor/three.module.js is missing and every CDN mirror failed.';
  throw new Error('three.js unavailable');
}

const hex2vec = (h) => {
  const v = parseInt(h.slice(1), 16);
  return new THREE.Vector3(((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255);
};

/* ------------------------------------------------------------- 2. constants */
const BODY_H = 2.6;               // every model is normalised to this height

/* Ports of the lab's four particle presets. The lab drives these through a
   screen-space pass; the numbers mean the same thing per-point here. */
const SHELL_PRESETS = {
  contour:  { name: 'Contour Fade',    patch: { ptFill: 0.95, ptSoft: 0.10, ptColor: '#c8d9ef', ptTip: '#33518f', ptLightMix: 0,    ptInvert: true,  ptContrast: 1.8,  ptFloor: 0.045, ptGlow: 1, ptAdditive: false } },
  redprint: { name: 'Redprint Screen', patch: { ptFill: 0.75, ptSoft: 0.10, ptColor: '#ee4b35', ptTip: '#ee4b35', ptLightMix: 0.45, ptInvert: false, ptContrast: 1.15, ptFloor: 0,     ptGlow: 1, ptAdditive: false } },
  blueprint:{ name: 'Blueprint Screen',patch: { ptFill: 0.78, ptSoft: 0.12, ptColor: '#1d7fa3', ptTip: '#0b4f68', ptLightMix: 0.4,  ptInvert: false, ptContrast: 1.2,  ptFloor: 0,     ptGlow: 1, ptAdditive: false } },
  scan:     { name: 'Body Scan',       patch: { ptFill: 0.78, ptSoft: 0.12, ptColor: '#1d7fa3', ptTip: '#0b4f68', ptLightMix: 0.4,  ptInvert: false, ptContrast: 1.2,  ptFloor: 0,     ptGlow: 1, ptAdditive: false } },
};

/* Only complete organs. Excluded from the folder on purpose:
     kidney_with_labels  — sectioned kidney plus floating label geometry
     lungs               — hollow stylised shell, open at the front
     brain               — same organ as pink_brain at twice the triangle count

   hFrac  organ height as a fraction of body height (foot to crown)
   seat   height of the organ's centre, same fraction
   x      + is the subject's LEFT   (verified against the heart in stage 1)
   z      + is anterior
   yaw    correction for the source file's own axis convention
   ex/ez  unit direction this organ moves in when the explode slider is raised

   Every hFrac below was set by measuring the FITTED bounding box in cm on a
   175 cm frame and comparing it to adult anatomy, not by eye. Two of them were
   badly wrong on the first pass:

     kidneys  measured 28.3 cm across a pair that spans ~16 cm in a real
              abdomen. This file arranges the kidneys splayed out around the
              vessels, so its own proportions cannot be matched on every axis
              at once — it is sized by WIDTH, which is the dimension a viewer
              actually reads, and the ureters come out short as a result.
     liver    measured 12.3 W x 20.1 H x 22.7 D. A liver's longest dimension is
              its left-right width, so a 22.7 depth means the model sits rotated
              a quarter turn from anatomical.

              The SIGN of that quarter turn is not a coin flip, and +90 had it
              mirrored. This file carries named parts — liver, gallbladder,
              inferior vena cava, portal vein — so the axes can be solved rather
              than guessed. In the model's own frame the IVC sits at x -3.2 cm,
              the most posterior structure on a liver, fixing local +X as
              anterior; the gallbladder sits at z +2.1 cm and is always right of
              midline, fixing local +Z as the subject's RIGHT. Mapping local +X
              to world +Z and local +Z to world -X is yaw -90, not +90.        */
/* pitch tips an organ about the body's left-right axis, in degrees, after yaw
   has pointed it the right way round. yaw alone was never enough: it can get a
   model facing correctly and still leave it nose-down, and until now nothing
   here could say so. Liver is the one that needed it — see below. */
const ORGANS = [
  { id: 'brain',   file: 'pink_brain.glb',                   name: 'Brain',       sub: 'with brainstem',
    hFrac: 0.058, seat: 0.948, x: 0,      z: 0.000, yaw: -90, ex: 0,    ez: 0,    color: '#e0a3b4' },
  { id: 'lungs',   file: 'realistic_human_lungs.glb',        name: 'Lungs',       sub: 'with trachea',
    hFrac: 0.185, seat: 0.748, x: 0,      z: 0.002, yaw: 0,   ex: 0,    ez: 0.35, color: '#d98fa0' },
  { id: 'heart',   file: 'realistic_human_heart.glb',        name: 'Heart',       sub: 'with great vessels',
    hFrac: 0.069, seat: 0.715, x: 0.022,  z: 0.028, yaw: -12, ex: 0.75, ez: 0.65, color: '#c8384f' },
  /* This file rests nose-down: its diaphragmatic surface falls 31.6 degrees
     front to back while the side-to-side tilt is only 3.1. pitch -14 takes most
     of that out — not the full amount, because a liver genuinely is a wedge,
     thick behind and tapering forward, so levelling the measurement exactly
     would tip it backwards instead. z moves with the pitch, from -0.004 to
     0.013: rotating about the organ's own centre swings its posterior corner
     back, and at -0.004 that corner left the body through the spine. */
  { id: 'liver',   file: 'human_liver_and_gallbladder.glb',  name: 'Liver + GB',  sub: 'with gallbladder',
    hFrac: 0.098, seat: 0.620, x: -0.032, z: 0.013, yaw: -90, pitch: -14, ex: -0.9, ez: 0.35, color: '#8f3b34' },
  { id: 'stomach', file: 'realistic_stomach.glb',            name: 'Stomach',     sub: 'with duodenum',
    hFrac: 0.098, seat: 0.596, x: 0.032,  z: -0.010, yaw: 0,  ex: 0.9,  ez: 0.3,  color: '#cf7a80' },
  { id: 'kidneys', file: 'human_kidney.glb',                 name: 'Kidneys',     sub: 'with ureters',
    hFrac: 0.083, seat: 0.583, x: 0,      z: -0.032, yaw: 0,  ex: 0,    ez: -1,   color: '#a34a52' },
  { id: 'gut',     file: 'small_and_large_intestine.glb',    name: 'Intestines',  sub: 'small and large',
    hFrac: 0.150, seat: 0.530, x: 0,      z: 0.010, yaw: 0,   ex: 0,    ez: 0.6,  color: '#c98a6b' },
];

/* ------------------------------------------------------------- 3. app state */
const state = {
  body: 'Male',
  preset: 'contour',

  count: 150000,
  dotSize: 0.0062,
  ptFill: 0.95, ptSoft: 0.10,
  ptColor: '#c8d9ef', ptTip: '#33518f',
  ptLightMix: 0, ptInvert: true, ptContrast: 1.8, ptFloor: 0.045,
  ptGlow: 1, ptAdditive: false,
  ptOpacity: 1,
  backFade: 0.45,          // 3D-only: separate the far shell from the near one
  showShell: true,
  showSkin: false,

  /* Correct proportions and an unoccluded read are genuinely in tension: a
     trunk is full. Checked per 2 cm slab against this body's own silhouette,
     the abdominal organs clear the wall by 0.6 to 2.4 cm and the liver still
     grazes it by 0.5 cm — which is what a liver does. There is no arrangement
     that spreads real-sized viscera apart and keeps them inside the body.

     Hence two separate levers. organScaleAll shrinks everything about its own
     centre, which opens gaps without moving anything out of place — 0.88 is
     the most shrink that still reads as anatomical. explode pushes organs off
     the body axis, which separates them properly but takes them outside the
     silhouette past about 0.012; that is an exploded-diagram look, deliberate
     rather than anatomical, so it is off by default. */
  organScaleAll: 0.88,
  explode: 0,

  organTint: true,         // per-organ colour vs one shared colour
  organUniform: '#c8384f',
  organRough: 0.3,
  organEmissive: 0.1,
  organTransmission: 0.15,

  autoRotate: true,
  exposure: 1.05,
  selected: 'heart',
};

for (const o of ORGANS) { o.scale = 1; o.visible = true; if (o.pitch === undefined) o.pitch = 0; }

/* ------------------------------------------------------------- 4. renderer */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
const PIXEL = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(PIXEL);
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = state.exposure;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.02, 200);
let W = 1, H = 1;

/* ---------------------------------------------------- 5. gradient backdrop */
const bgSphere = new THREE.Mesh(
  new THREE.SphereGeometry(60, 32, 24),
  new THREE.ShaderMaterial({
    uniforms: { uTop: { value: hex2vec('#d6e7f8') }, uBottom: { value: hex2vec('#fbfdff') }, uGlow: { value: hex2vec('#9edcff') } },
    side: THREE.BackSide, depthWrite: false, depthTest: false,
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      varying vec3 vP; uniform vec3 uTop, uBottom, uGlow;
      void main() {
        vec3 d = normalize(vP);
        vec3 c = mix(uBottom, uTop, pow(clamp(d.y*0.5+0.5,0.0,1.0), 0.85));
        c += uGlow * pow(max(0.0, 1.0 - length(d.xy - vec2(0.0,0.12))), 3.0) * 0.18;
        gl_FragColor = vec4(c, 1.0);
      }`,
  })
);
bgSphere.renderOrder = -1000; bgSphere.frustumCulled = false;
scene.add(bgSphere);

/* ------------------------------------------------------------- 6. lighting */
scene.add(new THREE.AmbientLight('#dfeaf7', 0.62));
const keyLight = new THREE.DirectionalLight('#ffffff', 2.3); keyLight.position.set(2.4, 3.2, 2.6); scene.add(keyLight);
const rimLight = new THREE.DirectionalLight('#bfeaff', 3.0); rimLight.position.set(-2.6, 1.4, -2.8); scene.add(rimLight);
const fillLight = new THREE.DirectionalLight('#ffd6e0', 0.85); fillLight.position.set(-1.8, -1.2, 2.2); scene.add(fillLight);

/* -------------------------------------------------- 7. hand-rolled GLB read */
const COMP = {
  5120: { A: Int8Array, s: 1, get: (d, o) => d.getInt8(o) },
  5121: { A: Uint8Array, s: 1, get: (d, o) => d.getUint8(o) },
  5122: { A: Int16Array, s: 2, get: (d, o) => d.getInt16(o, true) },
  5123: { A: Uint16Array, s: 2, get: (d, o) => d.getUint16(o, true) },
  5125: { A: Uint32Array, s: 4, get: (d, o) => d.getUint32(o, true) },
  5126: { A: Float32Array, s: 4, get: (d, o) => d.getFloat32(o, true) },
};
const NUM = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4, MAT2: 4, MAT3: 9, MAT4: 16 };

function parseContainer(buffer, name) {
  const dv = new DataView(buffer);
  if (dv.getUint32(0, true) !== 0x46546c67) throw new Error(`${name} is not a binary glTF`);
  let off = 12, json = null, bin = null;
  while (off + 8 <= buffer.byteLength) {
    const len = dv.getUint32(off, true), type = dv.getUint32(off + 4, true), start = off + 8;
    if (type === 0x4e4f534a) json = JSON.parse(new TextDecoder().decode(new Uint8Array(buffer, start, len)));
    else if (type === 0x004e4942) bin = new Uint8Array(buffer, start, len);
    off = start + len;
  }
  if (!json) throw new Error(`${name} has no JSON chunk`);
  return { json, bin };
}

function readTyped(json, bin, bvIndex, byteOffset, componentType, count, num) {
  const comp = COMP[componentType];
  const out = new comp.A(count * num);
  if (bvIndex === undefined) return out;
  const bv = json.bufferViews[bvIndex];
  const base = (bv.byteOffset || 0) + byteOffset;
  const stride = bv.byteStride || comp.s * num;
  const dv = new DataView(bin.buffer, bin.byteOffset, bin.byteLength);
  for (let i = 0; i < count; i++) {
    const o = base + i * stride;
    for (let j = 0; j < num; j++) out[i * num + j] = comp.get(dv, o + j * comp.s);
  }
  return out;
}

function readAccessor(json, bin, index) {
  const acc = json.accessors[index];
  const num = NUM[acc.type];
  return { array: readTyped(json, bin, acc.bufferView, acc.byteOffset || 0, acc.componentType, acc.count, num), itemSize: num };
}

const nullMat = new THREE.MeshBasicMaterial({ visible: false });

function buildGeometries(json, bin, meshIndex, cache) {
  if (cache.has(meshIndex)) return cache.get(meshIndex);
  const list = [];
  for (const prim of json.meshes[meshIndex].primitives) {
    if ((prim.mode === undefined ? 4 : prim.mode) !== 4) continue;
    const geo = new THREE.BufferGeometry();
    const attrs = prim.attributes || {};
    for (const [k, v] of [['POSITION', 'position'], ['NORMAL', 'normal']]) {
      if (attrs[k] === undefined) continue;
      const acc = readAccessor(json, bin, attrs[k]);
      geo.setAttribute(v, new THREE.BufferAttribute(acc.array, acc.itemSize));
    }
    if (!geo.getAttribute('position')) continue;
    if (prim.indices !== undefined) {
      const i = readAccessor(json, bin, prim.indices);
      geo.setIndex(new THREE.BufferAttribute(i.array, 1));
    }
    if (!geo.getAttribute('normal')) geo.computeVertexNormals();
    list.push(geo);
  }
  cache.set(meshIndex, list);
  return list;
}

function buildNode(json, bin, index, cache, seen) {
  if (seen.has(index)) return null;
  seen.add(index);
  const n = json.nodes[index];
  const obj = new THREE.Group();
  obj.name = n.name || `node_${index}`;
  if (n.matrix) new THREE.Matrix4().fromArray(n.matrix).decompose(obj.position, obj.quaternion, obj.scale);
  else {
    if (n.translation) obj.position.fromArray(n.translation);
    if (n.rotation) obj.quaternion.fromArray(n.rotation);
    if (n.scale) obj.scale.fromArray(n.scale);
  }
  if (n.mesh !== undefined) for (const geo of buildGeometries(json, bin, n.mesh, cache)) obj.add(new THREE.Mesh(geo, nullMat));
  if (n.children) for (const c of n.children) { const k = buildNode(json, bin, c, cache, seen); if (k) obj.add(k); }
  seen.delete(index);
  return obj;
}

async function loadGLB(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} → HTTP ${res.status}`);
  const { json, bin } = parseContainer(await res.arrayBuffer(), url);
  const root = new THREE.Group();
  const cache = new Map();
  const sceneDef = json.scenes?.[json.scene ?? 0];
  const roots = sceneDef ? sceneDef.nodes : json.nodes.map((_, i) => i);
  for (const i of roots) { const n = buildNode(json, bin, i, cache, new Set()); if (n) root.add(n); }
  root.updateMatrixWorld(true);
  return root;
}

/* Recentre on the inner node and scale on a wrapper. Doing both to one node
   throws the model off screen: a node's own scale does not apply to its own
   position, so the recentring offset stays at the source file's scale. */
function fitToHeight(root, targetH, mode) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  if (box.isEmpty()) throw new Error('model has no renderable triangles');
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const k = targetH / Math.max(size.y, 1e-6);

  const holder = new THREE.Group();
  if (mode === 'floor') root.position.set(-centre.x, -box.min.y, -centre.z);
  else root.position.copy(centre).negate();
  holder.add(root);
  holder.scale.setScalar(k);
  holder.updateMatrixWorld(true);
  holder.userData.srcH = size.y;      // keep it, so hFrac stays editable later
  return holder;
}

function countTris(root) {
  let t = 0;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry;
    t += g.index ? g.index.count / 3 : g.getAttribute('position').count / 3;
  });
  return Math.round(t);
}

/* ------------------------------------- 8. area-weighted surface point sample */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function collectTriangles(root) {
  root.updateMatrixWorld(true);
  const pos = [], nrm = [];
  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
  const nA = new THREE.Vector3(), nB = new THREE.Vector3(), nC = new THREE.Vector3();
  const nMat = new THREE.Matrix3();
  let tris = 0;

  root.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    const g = o.geometry, p = g.getAttribute('position');
    if (!p) return;
    const n = g.getAttribute('normal'), idx = g.index;
    const count = idx ? idx.count : p.count;
    nMat.getNormalMatrix(o.matrixWorld);
    for (let i = 0; i < count; i += 3) {
      const a = idx ? idx.getX(i) : i, b = idx ? idx.getX(i + 1) : i + 1, c = idx ? idx.getX(i + 2) : i + 2;
      vA.fromBufferAttribute(p, a).applyMatrix4(o.matrixWorld);
      vB.fromBufferAttribute(p, b).applyMatrix4(o.matrixWorld);
      vC.fromBufferAttribute(p, c).applyMatrix4(o.matrixWorld);
      if (n) {
        nA.fromBufferAttribute(n, a).applyMatrix3(nMat).normalize();
        nB.fromBufferAttribute(n, b).applyMatrix3(nMat).normalize();
        nC.fromBufferAttribute(n, c).applyMatrix3(nMat).normalize();
      } else { nA.subVectors(vC, vB).cross(vB.clone().sub(vA)).normalize(); nB.copy(nA); nC.copy(nA); }
      pos.push(vA.x, vA.y, vA.z, vB.x, vB.y, vB.z, vC.x, vC.y, vC.z);
      nrm.push(nA.x, nA.y, nA.z, nB.x, nB.y, nB.z, nC.x, nC.y, nC.z);
      tris++;
    }
  });
  return { pos: new Float32Array(pos), nrm: new Float32Array(nrm), tris };
}

/* Mesh vertices clump wherever the model was tessellated finely — dense at the
   face and hands, sparse across the back — which reads as blotchy. Weighting
   by triangle area gives an even field regardless of tessellation. */
function samplePoints(soup, count, seed = 7) {
  const { pos, nrm, tris } = soup;
  const cdf = new Float64Array(tris);
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), cr = new THREE.Vector3();
  let total = 0;
  for (let t = 0; t < tris; t++) {
    const o = t * 9;
    ab.set(pos[o + 3] - pos[o], pos[o + 4] - pos[o + 1], pos[o + 5] - pos[o + 2]);
    ac.set(pos[o + 6] - pos[o], pos[o + 7] - pos[o + 1], pos[o + 8] - pos[o + 2]);
    total += cr.crossVectors(ab, ac).length() * 0.5;
    cdf[t] = total;
  }
  if (total <= 0) throw new Error('degenerate mesh — zero surface area');

  const rand = mulberry32(seed);
  const outP = new Float32Array(count * 3), outN = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const target = rand() * total;
    let lo = 0, hi = tris - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cdf[mid] < target) lo = mid + 1; else hi = mid; }
    const o = lo * 9;
    let u = rand(), v = rand();
    if (u + v > 1) { u = 1 - u; v = 1 - v; }
    const w = 1 - u - v, k = i * 3;
    for (let j = 0; j < 3; j++) {
      outP[k + j] = pos[o + j] * w + pos[o + 3 + j] * u + pos[o + 6 + j] * v;
      outN[k + j] = nrm[o + j] * w + nrm[o + 3 + j] * u + nrm[o + 6 + j] * v;
    }
    const len = Math.hypot(outN[k], outN[k + 1], outN[k + 2]) || 1;
    outN[k] /= len; outN[k + 1] /= len; outN[k + 2] /= len;
  }
  return { position: outP, normal: outN };
}

/* -------------------------------------------- 9. the Contour Fade point shader */
/* Direct port of the lab's halftone ink model, evaluated per point instead of
   per screen cell:

       tone   = mix(facing, ndl, lightMix)
       bright = invert ? 1 - tone : tone
       cov    = floor + (1 - floor) * bright ^ contrast
       radius = 0.5 * fill * sqrt(cov)
       colour = mix(colour, tip, bright)

   depthWrite stays off. With it on, near dots punch holes in the depth buffer
   and the organ behind them vanishes in a ring of dead pixels. With it off the
   organs write depth first, near dots pass the test, far dots are rejected. */
const U = {
  uSize: { value: state.dotSize },
  uViewportH: { value: 800 },
  uLightDir: { value: new THREE.Vector3(0.5, 0.7, 0.5).normalize() },
  uLightMix: { value: state.ptLightMix },
  uInvert: { value: state.ptInvert ? 1 : 0 },
  uContrast: { value: state.ptContrast },
  uFloor: { value: state.ptFloor },
  uFill: { value: state.ptFill },
  uSoft: { value: state.ptSoft },
  uColor: { value: hex2vec(state.ptColor) },
  uTip: { value: hex2vec(state.ptTip) },
  uGlow: { value: state.ptGlow },
  uOpacity: { value: state.ptOpacity },
  uBackFade: { value: state.backFade },
};

const shellMat = new THREE.ShaderMaterial({
  uniforms: U,
  transparent: true, depthTest: true, depthWrite: false,
  vertexShader: `
    uniform float uSize, uViewportH, uLightMix, uInvert, uContrast, uFloor, uFill, uBackFade;
    uniform vec3 uLightDir;
    varying float vBright, vAlpha;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vec3 n = normalize(normalMatrix * normal);
      vec3 v = normalize(-mv.xyz);
      float signedFacing = dot(n, v);

      float facing = clamp(abs(signedFacing), 0.0, 1.0);
      float ndl = clamp(dot(n, normalize((viewMatrix * vec4(uLightDir, 0.0)).xyz)) * 0.5 + 0.5, 0.0, 1.0);
      float tone = mix(facing, ndl, uLightMix);
      float bright = mix(tone, 1.0 - tone, uInvert);
      float cov = uFloor + (1.0 - uFloor) * pow(clamp(bright, 0.0, 1.0), uContrast);
      vBright = bright;

      float pxPerUnit = uViewportH * projectionMatrix[1][1] * 0.5;
      float want = uSize * uFill * sqrt(cov) * pxPerUnit / max(-mv.z, 0.001);

      /* Below one pixel the rasteriser still draws a full-strength dot, which
         would flatten the fade into uniform speckle. Hold the size at 1 px and
         pay the difference in alpha instead, by area. */
      float sz = max(want, 1.0);
      float shrink = clamp(want / sz, 0.0, 1.0);
      vAlpha = shrink * shrink;

      /* 3D-only. The ink model throws the sign away with abs(), but a screen
         pass could never recover it at all: this is what separates the far
         shell from the near one and stops the two piling up. */
      float away = 1.0 - smoothstep(-0.35, 0.05, signedFacing);
      vAlpha *= mix(1.0, 1.0 - uBackFade, away);

      gl_PointSize = clamp(sz, 1.0, 64.0);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vBright, vAlpha;
    uniform vec3 uColor, uTip;
    uniform float uSoft, uOpacity, uGlow;
    void main() {
      vec2 q = gl_PointCoord - 0.5;
      float d = length(q);
      float aa = fwidth(d) + 0.002;
      float mask = 1.0 - smoothstep(0.5 - uSoft * 0.5 - aa, 0.5, d);
      if (mask <= 0.004) discard;
      float a = vAlpha * uOpacity * mask;
      if (a <= 0.004) discard;
      gl_FragColor = vec4(mix(uColor, uTip, clamp(vBright, 0.0, 1.0)) * uGlow, a);
    }`,
});

const skinMat = new THREE.MeshPhysicalMaterial({
  color: '#dfeaf5', roughness: 0.75, metalness: 0,
  transparent: true, opacity: 0.13, side: THREE.DoubleSide, depthWrite: false,
});

/* ------------------------------------------------------------ 10. the scene */
const stage = new THREE.Group();
scene.add(stage);

const world = { soup: null, shell: null, skin: null, centreline: null };

/* An A-pose figure's bounding box is 0.6 as wide as it is tall, so its centre
   says nothing about where the trunk is: the arms dominate x, and in z the
   chest, belly and pelvis each sit at a different depth.

   A single measurement at chest height is therefore not enough — anchoring
   every organ to one chest-level centre pushed the liver 5.7 cm out through
   the front of the abdomen, because the abdomen's centreline is not the
   chest's. So sample a centreline: one trunk centre per horizontal slab, and
   seat each organ against the slab at its own height.

   Per slab the midline comes from the MEDIAN x, which ignores the arms in a
   way a mean cannot, and the depth centre is measured only from points near
   that midline, so shoulders and hands stay out of it. */
const SLAB = 0.011;                     // of body height, ~2 cm on an adult

function buildCentreline(soup, height) {
  const { pos } = soup;
  const n = pos.length / 3;
  const step = height * SLAB;
  const slabs = Math.ceil(height / step) + 1;
  const bucketX = Array.from({ length: slabs }, () => []);

  for (let i = 0; i < n; i++) {
    const k = Math.floor(pos[i * 3 + 1] / step);
    if (k >= 0 && k < slabs) bucketX[k].push(pos[i * 3]);
  }
  const midX = bucketX.map((xs) => {
    if (xs.length < 20) return null;
    xs.sort((a, b) => a - b);
    return xs[xs.length >> 1];
  });

  const near = height * 0.085;
  const zLo = new Float64Array(slabs).fill(Infinity);
  const zHi = new Float64Array(slabs).fill(-Infinity);
  for (let i = 0; i < n; i++) {
    const k = Math.floor(pos[i * 3 + 1] / step);
    if (k < 0 || k >= slabs || midX[k] === null) continue;
    if (Math.abs(pos[i * 3] - midX[k]) > near) continue;
    const z = pos[i * 3 + 2];
    if (z < zLo[k]) zLo[k] = z;
    if (z > zHi[k]) zHi[k] = z;
  }

  const line = [];
  for (let k = 0; k < slabs; k++) {
    line.push(midX[k] === null || !isFinite(zLo[k])
      ? null
      : { x: midX[k], z: (zLo[k] + zHi[k]) / 2 });
  }
  return { step, line };
}

/* Nearest populated slab, so an organ never falls back to the origin just
   because its own slab happened to be empty. */
function centreAt(y) {
  const cl = world.centreline;
  if (!cl) return { x: 0, z: 0 };
  const k = Math.max(0, Math.min(cl.line.length - 1, Math.floor(y / cl.step)));
  for (let d = 0; d < cl.line.length; d++) {
    if (cl.line[k - d]) return cl.line[k - d];
    if (cl.line[k + d]) return cl.line[k + d];
  }
  return { x: 0, z: 0 };
}

function rebuildShell() {
  if (world.shell) { stage.remove(world.shell); world.shell.geometry.dispose(); world.shell = null; }
  if (!world.soup) return;
  const { position, normal } = samplePoints(world.soup, state.count, 7);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(position, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(normal, 3));
  const pts = new THREE.Points(geo, shellMat);
  pts.frustumCulled = false;
  pts.renderOrder = 10;                 // after the organs, so depth is laid down first
  pts.visible = state.showShell;
  world.shell = pts;
  stage.add(pts);
  $('#hud-pts').textContent = state.count.toLocaleString('en-US');
}

function placeOrgan(o) {
  if (!o.holder) return;
  const h = BODY_H, t = centreAt(o.seat * h);
  /* Derive the scale from hFrac every time rather than caching it at load, so
     the anatomical fraction stays the single source of truth and remains
     editable. srcH is the model's own height, which is meaningless on its own
     — these files span 0.22 to 53 units for the same class of object. */
  o.holder.scale.setScalar((o.hFrac * h / o.srcH) * o.scale * state.organScaleAll);
  o.holder.position.set(
    t.x + (o.x + (o.ex || 0) * state.explode) * h,
    o.seat * h,
    t.z + (o.z + (o.ez || 0) * state.explode) * h
  );
  /* Order matters: three's default XYZ Euler applies Rx after Ry, so the pitch
     tips the already-seated organ in body space rather than in its own frame. */
  o.holder.rotation.set(o.pitch * Math.PI / 180, o.yaw * Math.PI / 180, 0);
}
function placeAll() { for (const o of ORGANS) placeOrgan(o); }

function applyOrganMaterials() {
  let tris = 0, shown = 0;
  for (const o of ORGANS) {
    if (!o.mat) continue;
    const c = state.organTint ? o.color : state.organUniform;
    o.mat.color.set(c);
    o.mat.emissive.set(c);
    o.mat.emissiveIntensity = state.organEmissive;
    o.mat.roughness = state.organRough;
    o.mat.transmission = state.organTransmission;
    if (o.visible) { tris += o.tris; shown++; }
  }
  $('#hud-otris').textContent = tris.toLocaleString('en-US');
  $('#hud-org').textContent = `${shown}/${ORGANS.length}`;
}

async function loadBody(name) {
  const root = await loadGLB(`GLB/${name}.glb`);
  const holder = fitToHeight(root, BODY_H, 'floor');
  if (world.skin) stage.remove(world.skin);
  world.soup = collectTriangles(holder);
  world.centreline = buildCentreline(world.soup, BODY_H);
  holder.traverse((o) => { if (o.isMesh) o.material = skinMat; });
  holder.visible = state.showSkin;
  world.skin = holder;
  stage.add(holder);
  rebuildShell();
  placeAll();
}

async function loadOrgan(o) {
  const root = await loadGLB(`GLB/organ/${o.file}`);
  o.tris = countTris(root);
  o.mat = new THREE.MeshPhysicalMaterial({
    color: o.color, roughness: state.organRough, metalness: 0,
    clearcoat: 0.45, clearcoatRoughness: 0.25, sheen: 0.35,
    emissive: o.color, emissiveIntensity: state.organEmissive,
    transmission: state.organTransmission, thickness: 0.9, ior: 1.4,
    attenuationColor: new THREE.Color('#5e0d1c'), attenuationDistance: 0.6,
  });
  root.traverse((m) => { if (m.isMesh) { m.material = o.mat; m.renderOrder = 0; } });

  /* Size by anatomical fraction of body height. The source numbers span
     0.48 to 1338 units for the same class of object, so neither the file's
     own scale nor its ratio to the body means anything. */
  o.holder = fitToHeight(root, o.hFrac * BODY_H, 'centre');
  o.srcH = o.holder.userData.srcH;
  o.holder.visible = o.visible;
  stage.add(o.holder);
  placeOrgan(o);
}

/* ------------------------------------------------------- 11. orbit control */
class Orbit {
  constructor(cam, el) {
    this.cam = cam; this.el = el;
    this.target = new THREE.Vector3(0, BODY_H * 0.55, 0);
    this.theta = 0.28; this.phi = Math.PI / 2 - 0.06; this.dist = 5.2;
    this.drag = null; this.last = { x: 0, y: 0 };
    el.addEventListener('pointerdown', (e) => {
      el.setPointerCapture(e.pointerId);
      this.drag = (e.button === 2 || e.shiftKey) ? 'pan' : 'rotate';
      this.last = { x: e.clientX, y: e.clientY };
    });
    el.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      const dx = e.clientX - this.last.x, dy = e.clientY - this.last.y;
      this.last = { x: e.clientX, y: e.clientY };
      if (this.drag === 'rotate') {
        this.theta -= dx * 0.0058;
        this.phi = Math.min(Math.PI - 0.05, Math.max(0.05, this.phi - dy * 0.0058));
      } else {
        const k = this.dist * 0.0016;
        const right = new THREE.Vector3().setFromMatrixColumn(this.cam.matrix, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(this.cam.matrix, 1);
        this.target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
      }
    });
    const end = (e) => { this.drag = null; try { el.releasePointerCapture(e.pointerId); } catch (_) {} };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    el.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.dist = Math.min(22, Math.max(0.35, this.dist * Math.exp(e.deltaY * 0.0011)));
    }, { passive: false });
  }
  update(dt) {
    if (state.autoRotate && !this.drag) this.theta += dt * 0.2;
    const sp = Math.sin(this.phi);
    this.cam.position.set(
      this.target.x + this.dist * sp * Math.sin(this.theta),
      this.target.y + this.dist * Math.cos(this.phi),
      this.target.z + this.dist * sp * Math.cos(this.theta)
    );
    this.cam.lookAt(this.target);
  }
  reset() { this.target.set(0, BODY_H * 0.55, 0); this.theta = 0.28; this.phi = Math.PI / 2 - 0.06; this.dist = 5.2; }
  focus(seat, dist) { this.target.set(0, seat * BODY_H, 0); this.theta = 0.3; this.phi = Math.PI / 2; this.dist = dist; }
}
const orbit = new Orbit(camera, canvas);

/* ------------------------------------------------------------ 12. the panel */
function applyPreset(id) {
  const p = SHELL_PRESETS[id];
  if (!p) return;
  Object.assign(state, p.patch);
  state.preset = id;
  syncShell();
  rebuildPanel();
}

function syncShell() {
  U.uSize.value = state.dotSize;
  U.uLightMix.value = state.ptLightMix;
  U.uInvert.value = state.ptInvert ? 1 : 0;
  U.uContrast.value = state.ptContrast;
  U.uFloor.value = state.ptFloor;
  U.uFill.value = state.ptFill;
  U.uSoft.value = state.ptSoft;
  U.uColor.value.copy(hex2vec(state.ptColor));
  U.uTip.value.copy(hex2vec(state.ptTip));
  U.uGlow.value = state.ptGlow;
  U.uOpacity.value = state.ptOpacity;
  U.uBackFade.value = state.backFade;
  shellMat.blending = state.ptAdditive ? THREE.AdditiveBlending : THREE.NormalBlending;
  shellMat.needsUpdate = true;
}

const pbody = $('#pbody');
let resampleTimer = null;

function sel() { return ORGANS.find((o) => o.id === state.selected) || ORGANS[0]; }

function apply(key) {
  switch (key) {
    case 'count':
      clearTimeout(resampleTimer);
      resampleTimer = setTimeout(() => rebuildShell(), 200);
      break;
    case 'body': loadBody(state.body).catch(fail); break;
    case 'showShell': if (world.shell) world.shell.visible = state.showShell; break;
    case 'showSkin': if (world.skin) world.skin.visible = state.showSkin; break;
    case 'exposure': renderer.toneMappingExposure = state.exposure; break;
    case 'organTint': case 'organUniform': case 'organRough':
    case 'organEmissive': case 'organTransmission':
      applyOrganMaterials(); break;
    default: syncShell();
  }
}

function slider(parent, label, get, set, min, max, step, fmt) {
  const row = document.createElement('div');
  row.className = 'row';
  const f = fmt || ((v) => (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(2)));
  row.innerHTML = `<div class="lab"><span>${label}</span><span class="v"></span></div>`;
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = get();
  const out = row.querySelector('.v');
  out.textContent = f(get());
  inp.addEventListener('input', () => { set(parseFloat(inp.value)); out.textContent = f(get()); });
  row.appendChild(inp);
  parent.appendChild(row);
}

function toggle(parent, label, get, set) {
  const t = document.createElement('div');
  t.className = 'tog' + (get() ? ' on' : '');
  t.innerHTML = `<span class="sw"></span><span>${label}</span>`;
  t.addEventListener('click', () => { set(!get()); t.classList.toggle('on', get()); });
  parent.appendChild(t);
}

function colour(parent, label, get, set) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="lab"><span>${label}</span></div>`;
  const inp = document.createElement('input');
  inp.type = 'color'; inp.value = get();
  inp.addEventListener('input', () => set(inp.value));
  row.appendChild(inp);
  parent.appendChild(row);
}

function section(title, open) {
  const el = document.createElement('div');
  el.className = 'sec' + (open ? '' : ' closed');
  const head = document.createElement('div');
  head.className = 'sec-h';
  head.innerHTML = `<span>${title}</span><span class="caret"></span>`;
  head.addEventListener('click', () => el.classList.toggle('closed'));
  el.appendChild(head);
  const body = document.createElement('div');
  body.className = 'sec-b';
  el.appendChild(body);
  pbody.appendChild(el);
  return body;
}

function chipRow(parent, label, opts, isOn, onPick) {
  const row = document.createElement('div');
  row.className = 'row';
  if (label) row.innerHTML = `<div class="lab"><span>${label}</span></div>`;
  const wrap = document.createElement('div');
  wrap.className = 'chips';
  for (const o of opts) {
    const c = document.createElement('div');
    c.className = 'chip' + (isOn(o) ? ' on' : '');
    c.textContent = o.label;
    c.addEventListener('click', () => onPick(o));
    wrap.appendChild(c);
  }
  row.appendChild(wrap);
  parent.appendChild(row);
}

function rebuildPanel() {
  const scrollTop = pbody.scrollTop;
  pbody.innerHTML = '';

  /* --- shell --- */
  const s1 = section('Point shell', true);
  chipRow(s1, 'Subject', [{ label: 'Male', v: 'Male' }, { label: 'Female', v: 'Female' }],
    (o) => state.body === o.v, (o) => { state.body = o.v; apply('body'); rebuildPanel(); });
  chipRow(s1, 'Preset (carried from the lab)',
    Object.entries(SHELL_PRESETS).map(([k, p]) => ({ label: p.name, v: k })),
    (o) => state.preset === o.v, (o) => applyPreset(o.v));
  slider(s1, 'Point count', () => state.count, (v) => { state.count = v; apply('count'); }, 30000, 320000, 10000, (v) => (v / 1000).toFixed(0) + 'k');
  slider(s1, 'Dot diameter', () => state.dotSize, (v) => { state.dotSize = v; syncShell(); }, 0.002, 0.018, 0.0001, (v) => v.toFixed(4));
  slider(s1, 'Ink fill', () => state.ptFill, (v) => { state.ptFill = v; syncShell(); }, 0.2, 1.4, 0.01);
  slider(s1, 'Contrast', () => state.ptContrast, (v) => { state.ptContrast = v; syncShell(); }, 0.4, 4, 0.01);
  slider(s1, 'Ink floor', () => state.ptFloor, (v) => { state.ptFloor = v; syncShell(); }, 0, 0.4, 0.001, (v) => v.toFixed(3));
  slider(s1, 'Light mix', () => state.ptLightMix, (v) => { state.ptLightMix = v; syncShell(); }, 0, 1, 0.01);
  slider(s1, 'Edge softness', () => state.ptSoft, (v) => { state.ptSoft = v; syncShell(); }, 0, 1, 0.01);
  colour(s1, 'Centre colour', () => state.ptColor, (v) => { state.ptColor = v; syncShell(); });
  colour(s1, 'Contour colour', () => state.ptTip, (v) => { state.ptTip = v; syncShell(); });
  slider(s1, 'Far-side fade (3D only)', () => state.backFade, (v) => { state.backFade = v; syncShell(); }, 0, 1, 0.01);
  slider(s1, 'Overall opacity', () => state.ptOpacity, (v) => { state.ptOpacity = v; syncShell(); }, 0.05, 1, 0.01);
  toggle(s1, 'Invert', () => state.ptInvert, (v) => { state.ptInvert = v; syncShell(); });
  toggle(s1, 'Additive blending', () => state.ptAdditive, (v) => { state.ptAdditive = v; syncShell(); });
  toggle(s1, 'Show point shell', () => state.showShell, (v) => { state.showShell = v; apply('showShell'); });
  toggle(s1, 'Show reference skin', () => state.showSkin, (v) => { state.showSkin = v; apply('showSkin'); });

  /* --- organ list --- */
  const s2 = section('Organs', true);
  slider(s2, 'Scale all organs', () => state.organScaleAll,
    (v) => { state.organScaleAll = v; placeAll(); }, 0.55, 1.25, 0.01);
  slider(s2, 'Explode (past 0.012 they leave the body)', () => state.explode,
    (v) => { state.explode = v; placeAll(); }, 0, 0.14, 0.001, (v) => v.toFixed(3));
  const list = document.createElement('div');
  list.className = 'olist';
  for (const o of ORGANS) {
    const r = document.createElement('div');
    r.className = 'orow' + (o.visible ? ' vis' : ' off') + (state.selected === o.id ? ' sel' : '');
    r.innerHTML = `<span class="sw2"></span><span class="swatch" style="background:${o.color}"></span>` +
                  `<span class="nm">${o.name}</span><span class="cn">${o.sub}</span>`;
    r.querySelector('.sw2').addEventListener('click', (e) => {
      e.stopPropagation();
      o.visible = !o.visible;
      if (o.holder) o.holder.visible = o.visible;
      r.classList.toggle('vis', o.visible);
      r.classList.toggle('off', !o.visible);
      applyOrganMaterials();
    });
    r.addEventListener('click', () => { state.selected = o.id; rebuildPanel(); });
    list.appendChild(r);
  }
  s2.appendChild(list);
  chipRow(s2, null, [
    { label: 'All', fn: () => ORGANS.forEach((o) => { o.visible = true; }) },
    { label: 'Chest only', fn: () => ORGANS.forEach((o) => { o.visible = ['heart', 'lungs'].includes(o.id); }) },
    { label: 'Abdomen only', fn: () => ORGANS.forEach((o) => { o.visible = ['liver', 'stomach', 'kidneys', 'gut'].includes(o.id); }) },
    { label: 'None', fn: () => ORGANS.forEach((o) => { o.visible = false; }) },
  ], () => false, (o) => {
    o.fn();
    ORGANS.forEach((g) => { if (g.holder) g.holder.visible = g.visible; });
    applyOrganMaterials();
    rebuildPanel();
  });

  /* --- selected organ --- */
  const o = sel();
  const s3 = section(`Placement · ${o.name}`, true);
  slider(s3, 'Anatomical height hFrac (of stature)', () => o.hFrac, (v) => { o.hFrac = v; placeOrgan(o); }, 0.02, 0.30, 0.001, (v) => v.toFixed(3));
  slider(s3, 'Size multiplier', () => o.scale, (v) => { o.scale = v; placeOrgan(o); }, 0.4, 2.2, 0.01);
  slider(s3, 'Seat height', () => o.seat, (v) => { o.seat = v; placeOrgan(o); }, 0.2, 1.02, 0.001, (v) => v.toFixed(3));
  slider(s3, 'Left / right (+ is subject left)', () => o.x, (v) => { o.x = v; placeOrgan(o); }, -0.18, 0.18, 0.001, (v) => v.toFixed(3));
  slider(s3, 'Front / back (+ is front)', () => o.z, (v) => { o.z = v; placeOrgan(o); }, -0.14, 0.14, 0.001, (v) => v.toFixed(3));
  slider(s3, 'Yaw, about the body axis', () => o.yaw, (v) => { o.yaw = v; placeOrgan(o); }, -180, 180, 1, (v) => v.toFixed(0) + '°');
  /* the axis this panel was missing: a model can face the right way and still
     be tipped, which is what the liver was doing at pitch 0 */
  slider(s3, 'Pitch, tip forward or back', () => o.pitch, (v) => { o.pitch = v; placeOrgan(o); }, -60, 60, 1, (v) => v.toFixed(0) + '°');
  colour(s3, 'Colour', () => o.color, (v) => {
    o.color = v;
    const sw = pbody.querySelector('.orow.sel .swatch');
    if (sw) sw.style.background = v;
    applyOrganMaterials();
  });
  const focusBtn = document.createElement('div');
  focusBtn.className = 'btn';
  focusBtn.textContent = 'Focus this organ';
  focusBtn.addEventListener('click', () => orbit.focus(o.seat, Math.max(o.hFrac * BODY_H * 4.5, 0.6)));
  s3.appendChild(focusBtn);

  /* --- material + view --- */
  const s4 = section('Organ material', false);
  toggle(s4, 'Tint each organ separately', () => state.organTint, (v) => { state.organTint = v; apply('organTint'); });
  colour(s4, 'Shared colour (when tinting is off)', () => state.organUniform, (v) => { state.organUniform = v; apply('organUniform'); });
  slider(s4, 'Roughness', () => state.organRough, (v) => { state.organRough = v; apply('organRough'); }, 0, 1, 0.01);
  slider(s4, 'Emissive', () => state.organEmissive, (v) => { state.organEmissive = v; apply('organEmissive'); }, 0, 0.8, 0.01);
  slider(s4, 'Transmission', () => state.organTransmission, (v) => { state.organTransmission = v; apply('organTransmission'); }, 0, 1, 0.01);

  const s5 = section('View', false);
  toggle(s5, 'Auto-rotate', () => state.autoRotate, (v) => { state.autoRotate = v; });
  slider(s5, 'Exposure', () => state.exposure, (v) => { state.exposure = v; apply('exposure'); }, 0.4, 2, 0.01);
  chipRow(s5, 'Camera', [
    { label: 'Whole body', fn: () => orbit.reset() },
    { label: 'Chest', fn: () => orbit.focus(0.73, 1.5) },
    { label: 'Abdomen', fn: () => orbit.focus(0.55, 1.7) },
    { label: 'Head', fn: () => orbit.focus(0.94, 0.8) },
  ], () => false, (x) => x.fn());
  const dump = document.createElement('div');
  dump.className = 'btn';
  dump.textContent = 'Copy placement JSON';
  dump.addEventListener('click', () => {
    const data = ORGANS.map(({ id, file, hFrac, seat, x, z, yaw, pitch, scale, color, visible }) =>
      ({ id, file, hFrac, seat, x, z, yaw, pitch, scale, color, visible }));
    navigator.clipboard.writeText(JSON.stringify(data, null, 2))
      .then(() => toast('Placement JSON copied'))
      .catch(() => { console.log(JSON.stringify(data, null, 2)); toast('Written to the console'); });
  });
  s5.appendChild(dump);
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = 'Offsets are fractions of stature, so they survive a change of model. '
    + 'Organ sizes are calibrated against measured adult values at 175cm. '
    + 'A trunk is full: the liver clears the abdominal wall by about 1cm, so at true '
    + 'scale nothing can be arranged without overlap. To see something that is hidden, '
    + 'switch organs off from the list, raise Transmission, or pull Explode up for a '
    + 'diagram view. Excluded: kidney_with_labels (cutaway plus labels), lungs (hollow, '
    + 'simplified) and brain (a duplicate of pink_brain).';
  s5.appendChild(note);

  pbody.scrollTop = scrollTop;
}

/* ------------------------------------------------------------- 13. chrome */
const panel = $('#panel');
$('#fab-panel').addEventListener('click', () => panel.classList.remove('hidden'));
$('#fab-reset').addEventListener('click', () => orbit.reset());
$('#fab-shot').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = `point-body-${Date.now()}.png`;
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
  toast('PNG exported');
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'p' || e.key === 'P') panel.classList.toggle('hidden');
  if (e.key === ' ') { e.preventDefault(); state.autoRotate = !state.autoRotate; }
});

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}

function fail(err) {
  console.error(err);
  boot.classList.remove('gone');
  boot.querySelector('.bt').textContent = 'Load failed';
  bootSub.textContent = 'asset error';
  boot.querySelector('.bar')?.remove();
  const e = $('#boot-err');
  e.hidden = false;
  e.textContent = `${err.message}\n\nfile:// cannot fetch local GLB. Serve the folder over HTTP:\n  python -m http.server 8777`;
}

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  U.uViewportH.value = H * PIXEL;
}
window.addEventListener('resize', resize);
resize();

let last = performance.now(), acc = 0, frames = 0;
function loop() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  acc += dt; frames++;
  if (acc >= 0.5) { $('#hud-fps').textContent = Math.round(frames / acc); acc = 0; frames = 0; }
  orbit.update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* ----------------------------------------------------------------- 14. go */
try {
  const steps = ORGANS.length + 1;
  bootSub.textContent = 'body';
  await loadBody(state.body);
  bootBar.style.transform = `scaleX(${1 / steps})`;

  for (let i = 0; i < ORGANS.length; i++) {
    const o = ORGANS[i];
    bootSub.textContent = `${o.name.toLowerCase()} — ${i + 1}/${ORGANS.length}`;
    await loadOrgan(o);
    bootBar.style.transform = `scaleX(${(i + 2) / steps})`;
  }

  syncShell();
  applyOrganMaterials();
  rebuildPanel();
  boot.classList.add('gone');
  window.__ready = true;
  window.__dbg = { ORGANS, world, orbit, state, BODY_H, placeAll, placeOrgan, rebuildPanel, applyOrganMaterials };
  requestAnimationFrame(loop);
} catch (err) {
  fail(err);
}
</script>
